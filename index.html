<meta property="og:type" content="website">

<meta property="og:description" content="A short interactive movie for kids getting braces: what happens at the orthodontist, how braces gently move teeth, and how to care for them.">

<style>
  :root { --plum: #432945; --pink: #F285B5; --white: #fff; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #F7EC45; color: var(--plum); font-family: 'Varela Round', ui-rounded, system-ui, sans-serif; -webkit-tap-highlight-color: transparent; }
  /* Sideways on a phone the page gets room to scroll: that is the only thing that lets Safari fold its bar away. */
  html.roll, html.roll body { height: auto; overflow: visible; }
  html.roll body { min-height: 1000vh; }
  /* The movie is the whole page. fit() sizes the stage to the screen and turns it on a phone held upright. */
  .stage { position: fixed; left: 0; top: 0; transform-origin: 0 0; overflow: hidden; }
  video { position: absolute; inset: 0; display: block; width: 100%; height: 100%; object-fit: cover; }
  .lang { position: absolute; z-index: 2; top: 20px; left: max(22px, env(safe-area-inset-left)); display: flex; padding: 2px; transform-origin: 0 0; border-radius: 999px; background: var(--white); direction: ltr; }
  @media (hover: hover) and (pointer: fine) { .lang { transform: scale(1.25); } }   /* a mouse is less exact, and the screen is big */
  .lang button { position: relative; min-width: 38px; min-height: 22px; padding: 0 7px; border: 0; border-radius: 999px; background: none; color: var(--plum); font: inherit; font-size: 11px; cursor: pointer; transition: background .2s, transform .12s; }
  .lang button:active { transform: scale(.94); }
  .lang button::after { content: ''; position: absolute; inset: -10px -2px; }   /* small to see, still easy to hit */
  .lang button[aria-pressed=true] { background: var(--pink); color: var(--plum); }
  #hit { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; padding: 0; background: none; cursor: default; touch-action: manipulation; }
  /* the place to press: big and forgiving, with a ripple so the waiting picture stays alive */
  #spot { position: absolute; z-index: 1; aspect-ratio: 1; transform: translate(-50%, -50%); border: 0; padding: 0; border-radius: 50%; background: none; cursor: pointer; touch-action: manipulation; }
  #spot[hidden] { display: none; }
  #spot::before, #spot::after { content: ''; position: absolute; inset: 22%; border: 4px solid var(--white); border-radius: 50%; opacity: 0; }
  #spot.waiting::before { animation: ripple 1.1s ease-out infinite; }
  #spot.waiting::after { animation: ripple 1.1s ease-out .55s infinite; }
  #spot.nudge { animation: nudge .32s ease-out; }
  #spot.pop::before { animation: pop .22s ease-out; }
  @keyframes ripple { from { transform: scale(.55); opacity: .95; } to { transform: scale(1.3); opacity: 0; } }
  @keyframes pop { from { transform: scale(.7); opacity: 1; } to { transform: scale(1.5); opacity: 0; } }
  @keyframes nudge { 30% { transform: translate(-50%, -50%) scale(1.22); } 65% { transform: translate(-50%, -50%) scale(.94); } }
  #play { position: absolute; inset: 0; display: grid; place-items: center; width: 100%; border: 0; background: none; cursor: pointer; padding: 0; }
  #play i { display: grid; place-items: center; width: clamp(72px, 13vw, 118px); aspect-ratio: 1; border-radius: 50%; background: var(--white); box-shadow: 0 6px 0 rgba(67, 41, 69, .16); transition: transform .14s; }
  #play:hover i { transform: scale(1.06); }
  #play:active i { transform: scale(.94); }
  #play svg { width: 44%; margin-inline-start: 6%; direction: ltr; }
  #play[hidden] { display: none; }
  /* on the dark floor, wherever it runs */
  /* sideways on a phone with Safari's bar still up: a bouncing arrow says swipe up */
  #swipe { position: absolute; z-index: 2; left: max(22px, env(safe-area-inset-left)); bottom: 12px; display: grid; place-items: center; width: 52px; height: 52px; border-radius: 50%; background: var(--white); pointer-events: none; animation: rise 1s ease-in-out infinite alternate; }
  #swipe[hidden] { display: none; }
  #swipe svg { width: 58%; }
  @keyframes rise { from { transform: translateY(6px); } to { transform: translateY(-10px); } }
  /* on the artwork's dark floor */
  footer { position: absolute; z-index: 2; left: 0; right: 0; padding-right: max(44px, calc(env(safe-area-inset-right) + 16px)); display: flex; align-items: center; justify-content: flex-end; direction: ltr; pointer-events: none; }
  .brand { display: block; padding: 6px 20px; border-radius: 999px; background: var(--white); pointer-events: auto; transition: transform .12s; }
  .brand:hover { transform: scale(1.04); }
  .brand:active { transform: scale(.95); }
  .brand img { display: block; height: 26px; }
  @media (max-height: 520px), (max-width: 520px) { .brand { padding: 5px 16px; } .brand img { height: 21px; } }   /* a phone's floor is only about 40px tall */
</style>
</head>
<body>
<div class="stage">
  <video id="movie" poster="media/poster.jpg" playsinline preload="metadata" disablepictureinpicture></video>
  <button id="hit" type="button" tabindex="-1" aria-hidden="true"></button>
  <button id="spot" type="button" aria-label="OK" hidden></button>
  <button id="play" type="button" aria-label="Play"><i><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3.5v17a1.2 1.2 0 0 0 1.8 1l14-8.5a1.2 1.2 0 0 0 0-2L7.8 2.5a1.2 1.2 0 0 0-1.8 1Z" fill="#F285B5"/></svg></i></button>
  <div id="swipe" aria-hidden="true" hidden><svg viewBox="0 0 24 24"><path d="M12 20V5M5 11.5 12 4.5l7 7" fill="none" stroke="#F285B5" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
  <footer>
    <a class="brand" href="https://www.zizzlelab.com/" target="_blank" rel="noopener"><img src="art/zizzlelab.png" alt="Zizzlelab"></a>
  </footer>
</div>
<script>
  // Each language's line starts, so the toggle lands on the same moment of the story.
  var CUES = {"en": [0.8, 6.66, 13.82, 17.31, 20.12, 24.36, 29.03, 32.13, 39.93, 48.03, 51.95, 55.17, 59.22, 63.44, 69.07, 72.41, 79.35, 84.03, 95.25, 104.33, 110.89, 114.72, 120.53, 123.01, 125.91, 130.76, 139.84, 146.41, 152.79, 157.71]};
  // Where the movie stops until the child presses the white circle.
  var GATES = {"en": [{"id": "door_p", "on": 3.96, "stop": 6.51, "x": 0.5712, "y": 0.6465}, {"id": "back_p", "on": 14.81, "stop": 17.16, "x": 0.424, "y": 0.277}, {"id": "hold_p", "on": 21.86, "stop": 23.36, "x": 0.5448, "y": 0.4199}, {"id": "polish_p", "on": 30.03, "stop": 31.98, "x": 0.7337, "y": 0.2148}, {"id": "glue_p", "on": 49.65, "stop": 51.8, "x": 0.534, "y": 0.3849}, {"id": "light_p", "on": 53.07, "stop": 55.02, "x": 0.7337, "y": 0.1855}, {"id": "wire_p", "on": 60.94, "stop": 62.44, "x": 0.7469, "y": 0.5469}, {"id": "bands_p", "on": 70.11, "stop": 72.26, "x": 0.5, "y": 0.1855}, {"id": "wax_p", "on": 118.03, "stop": 119.53, "x": 0.6854, "y": 0.166}, {"id": "brush_p", "on": 123.81, "stop": 125.76, "x": 0.725, "y": 0.1953}, {"id": "off_p", "on": 150.49, "stop": 152.64, "x": 0.5369, "y": 0.3862}]};
  var WORDS = {
    en: { dir: 'ltr', page: 'Getting braces | Zizzle Inventions', play: 'Play' }
  };
  var movie = document.getElementById('movie'), play = document.getElementById('play');
  var buttons = document.querySelectorAll('.lang button');
  var hit = document.getElementById('hit'), spot = document.getElementById('spot');
  var lang = null, waiting = null, live = null, passed = {};                 // live: a gate whose circle is up while the movie runs on to its stop

  // The picture is cut to fill the screen (its middle was drawn to survive that), so its points move with the screen's shape.
  var VW = 2276, VH = 1024, FLOOR = 874, view = { s: 1, x: 0, y: 0 };
  var stage = document.querySelector('.stage'), foot = document.querySelector('footer');
  var touching = false, rewind = 0;
  if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
  addEventListener('touchstart', function () { touching = true; }, { passive: true });
  addEventListener('touchend', function () { touching = false; fit(); }, { passive: true });
  function fit() {
    var iw = innerWidth, ih = innerHeight, turn = ih > iw;
    var roll = !turn && ih < 520 && navigator.maxTouchPoints > 0 && !navigator.standalone;       // from the Home Screen there are no bars to swipe away
    document.documentElement.classList.toggle('roll', roll);
    var barsUp = roll && Math.min(screen.width, screen.height) - ih > 30;
    document.getElementById('swipe').hidden = !barsUp;
    clearTimeout(rewind);
    if (barsUp) rewind = setTimeout(function () { if (!touching && scrollY > 0) scrollTo(0, 0); }, 700);     // Safari's bar came back: leave room to swipe it away again
    var w = turn ? ih : iw, h = turn ? iw : ih;
    stage.style.width = w + 'px';
    stage.style.height = h + 'px';
    stage.style.transform = turn ? 'translateX(' + iw + 'px) rotate(90deg)' : 'none';
    var s = Math.max(w / VW, h / VH);
    view = { s: s, x: (w - VW * s) / 2, y: (h - VH * s) / 2 };
    var top = view.y + FLOOR * s, band = h - top;
    foot.style.top = top + 'px';
    foot.style.height = band + 'px';
    var g = waiting || live;
    if (g) showSpot(g);
  }
  function saved() {
    try { return localStorage.getItem('braces-lang'); } catch (e) { return null; }
  }
  function remember(l) {
    try { localStorage.setItem('braces-lang', l); } catch (e) {}
  }
  function firstLang() {
    var asked = new URLSearchParams(location.search).get('lang');
    if (WORDS[asked]) return asked;
    if (WORDS[saved()]) return saved();
    return 'en';                                   // one language for now; the toggle comes back when a second one is recorded
  }
  // the same point of the same line, in the other language
  function sameMoment(t, from, to) {
    var a = CUES[from], b = CUES[to], i = a.length - 1;
    while (i > 0 && a[i] > t) i--;
    if (i === a.length - 1) return b[i] + Math.max(0, t - a[i]);
    return b[i] + (t - a[i]) / (a[i + 1] - a[i]) * (b[i + 1] - b[i]);
  }
  function setLang(l, keep) {
    if (l === lang) return;
    var from = lang, t = movie.currentTime, going = !movie.paused;
    lang = l;
    var w = WORDS[l];
    document.documentElement.lang = l;
    document.documentElement.dir = w.dir;
    document.title = w.page;
    play.setAttribute('aria-label', w.play);
    buttons.forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.lang === l)); });
    movie.src = 'media/' + l + '.mp4';
    if (keep && from && t > 0) {
      movie.addEventListener('loadedmetadata', function () {
        var g = waiting && gate(waiting.id);
        passed = {};
        var to = g ? g.stop : sameMoment(t, from, l);
        GATES[l].forEach(function (x) { if (x.stop < to && !(g && x.id === g.id)) passed[x.id] = true; });
        movie.currentTime = to;
        if (g) wait(g); else if (going) movie.play();
      }, { once: true });
    }
  }
  buttons.forEach(function (b) {
    b.addEventListener('click', function () { setLang(b.dataset.lang, true); remember(lang); });
  });
  function gate(id) { return GATES[lang].filter(function (g) { return g.id === id; })[0]; }
  function showSpot(g) {
    spot.style.left = view.x + g.x * VW * view.s + 'px';
    spot.style.top = view.y + g.y * VH * view.s + 'px';
    spot.style.width = Math.max(96, 380 * view.s) + 'px';
    spot.hidden = false;
  }
  function wait(g) {
    waiting = g;
    movie.pause();
    showSpot(g);
    spot.classList.add('waiting');
    play.hidden = true;
  }
  // the press: answer at once, then the movie carries on from the moment before the action
  function pressed() {
    var g = waiting || live;
    if (!g) return;
    passed[g.id] = true;
    spot.classList.remove('waiting', 'pop');
    void spot.offsetWidth;
    spot.classList.add('pop');
    if (waiting) waiting = null;
    else movie.currentTime = g.stop;
    live = null;
    movie.play();
    setTimeout(function () { if (!waiting && !live) spot.hidden = true; }, 240);
  }
  function watch() {
    var t = movie.currentTime;
    if (!movie.paused && !waiting) {
      GATES[lang].some(function (g) {
        if (passed[g.id]) return false;
        if (t >= g.stop - 0.02) { live = null; wait(g); return true; }
        if (t >= g.on && live !== g) { live = g; showSpot(g); }
        return t < g.stop;
      });
    }
    requestAnimationFrame(watch);
  }
  requestAnimationFrame(watch);
  spot.addEventListener('pointerdown', function (e) { e.preventDefault(); pressed(); });
  spot.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') pressed(); });
  // a press anywhere else: the circle bounces while waiting; otherwise it pauses or carries on
  hit.addEventListener('click', function () {
    if (waiting) {
      spot.classList.remove('nudge');
      void spot.offsetWidth;
      spot.classList.add('nudge');
    } else if (!movie.paused) {
      movie.pause();
      play.hidden = false;
    }
  });
  function goFull() {          // Android and iPad can hide the browser's bars; iPhone Safari cannot, so there this does nothing
    var root = document.documentElement, full = root.requestFullscreen || root.webkitRequestFullscreen;
    if (!full || navigator.maxTouchPoints === 0 || document.fullscreenElement || document.webkitFullscreenElement) return;
    try { var p = full.call(root); if (p && p.catch) p.catch(function () {}); } catch (e) {}
  }
  play.addEventListener('click', function () { play.hidden = true; goFull(); movie.play(); });
  movie.addEventListener('play', function () { play.hidden = true; document.body.classList.add('playing'); });
  movie.addEventListener('pause', function () { if (!waiting) document.body.classList.remove('playing'); });
  movie.addEventListener('ended', function () {
    play.hidden = false; passed = {}; waiting = null; live = null; spot.hidden = true;
    document.body.classList.remove('playing');
    movie.currentTime = 0;
  });
  addEventListener('resize', fit);
  addEventListener('scroll', fit, { passive: true });
  if (window.visualViewport) visualViewport.addEventListener('resize', fit);
  addEventListener('orientationchange', function () {   // Safari reports the new size a moment after turning
    [50, 250, 600].forEach(function (ms) { setTimeout(fit, ms); });
  });
  fit();
  setLang(firstLang(), false);
</script>
</body>
</html>
